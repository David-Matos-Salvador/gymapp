# Despliegues a través de Coolify (equivalente a los pipelines de Bitbucket).
#
# QA
#   - Solo manual: Actions → "Deploy" → Run workflow → "Use workflow from" = rama a desplegar
#     (cualquier rama: main, feat/…, fix/…). QA muestra la última rama desplegada.
#
# Producción
#   - Solo automático al publicar un tag vX.Y.Z hecho sobre main:
#       git checkout main && git pull && git tag v1.0.0 && git push origin v1.0.0
#   - Despliega exactamente el commit del tag.
#
# Requiere en el repo (Settings → Secrets and variables → Actions):
#   secret   COOLIFY_TOKEN       token de API de Coolify con permisos write y deploy
#   variable COOLIFY_URL         https://coolify.davidmatos.lat
#   variable COOLIFY_QA_UUID     uuid de la app de QA en Coolify (aparece en su URL)
#   variable COOLIFY_PROD_UUID   uuid de la app de producción (cuando exista)
# En Coolify, desactivar "Auto Deploy" en esas apps: los deploys los decide este workflow.
name: Deploy

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

concurrency:
  group: deploy-${{ github.ref_type == 'tag' && 'produccion' || 'qa' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decidir ambiente
        id: cfg
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          QA_UUID: ${{ vars.COOLIFY_QA_UUID }}
          PROD_UUID: ${{ vars.COOLIFY_PROD_UUID }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            # Producción: el tag tiene que apuntar a un commit que ya esté en main.
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::El tag $REF_NAME no está sobre main. Producción solo se despliega desde main."
              exit 1
            fi
            ambiente=produccion; uuid="$PROD_UUID"; branch=main; sha="$GITHUB_SHA"
          else
            ambiente=qa; uuid="$QA_UUID"; branch="$REF_NAME"; sha=HEAD
          fi
          if [[ -z "$uuid" ]]; then
            echo "::error::Falta la variable con el uuid de Coolify para '$ambiente'."
            exit 1
          fi
          {
            echo "ambiente=$ambiente"
            echo "uuid=$uuid"
            echo "branch=$branch"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"
          echo "### Desplegando \`$REF_NAME\` en **$ambiente**" >> "$GITHUB_STEP_SUMMARY"

      - name: Apuntar la app a la versión
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          APP_UUID: ${{ steps.cfg.outputs.uuid }}
          BRANCH: ${{ steps.cfg.outputs.branch }}
          SHA: ${{ steps.cfg.outputs.sha }}
        run: |
          curl -fsS --retry 3 -X PATCH \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg b "$BRANCH" --arg s "$SHA" '{git_branch: $b, git_commit_sha: $s}')" \
            "${COOLIFY_URL%/}/api/v1/applications/${APP_UUID}"

      - name: Desplegar
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          APP_UUID: ${{ steps.cfg.outputs.uuid }}
        run: |
          curl -fsS --retry 3 -X POST \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_URL%/}/api/v1/deploy?uuid=${APP_UUID}&force=false"
          echo "Seguimiento: ${COOLIFY_URL%/} → proyecto gymapp → Deployments" >> "$GITHUB_STEP_SUMMARY"
