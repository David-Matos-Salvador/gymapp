services:
  db:
    image: postgres:16-alpine
    container_name: gymapp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gymuser
      POSTGRES_PASSWORD: gympassword
      POSTGRES_DB: gymdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymuser -d gymdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gymapp-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://gymuser:gympassword@db:5432/gymdb?schema=public"
      AUTH_SECRET: "hiTXOFdVPhNNc0eZoTseTtnAikyix8lU+vk8EUSu4gI="
      AUTH_GOOGLE_ID: "675239987109-oq1qijd4tof7ilb5ja1jhrgcmc5dvu3n.apps.googleusercontent.com"
      AUTH_GOOGLE_SECRET: "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"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
