services:
  db:
    image: postgres:16-alpine
    container_name: gymapp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gymuser
      POSTGRES_PASSWORD: gympassword
      POSTGRES_DB: gymdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymuser -d gymdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gymapp-redis
    restart: unless-stopped
    ports:
      # 6380 en el host para no chocar con un Redis local (p.ej. Homebrew) en 6379
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gymapp-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://gymuser:gympassword@db:5432/gymdb?schema=public"
      REDIS_URL: "redis://redis:6379"
      AUTH_SECRET: "${AUTH_SECRET:?define AUTH_SECRET en .env}"
      AUTH_URL: "http://localhost:3000"
      AUTH_GOOGLE_ID: "${AUTH_GOOGLE_ID:-}"
      AUTH_GOOGLE_SECRET: "${AUTH_GOOGLE_SECRET:-}"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
